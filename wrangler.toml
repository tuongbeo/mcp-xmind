name = "mcp-xmind"
main = "src/index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

# Single KV namespace — stores both .xmind file content (base64) and metadata
# No R2 required! Works on Cloudflare Workers free plan.
[[kv_namespaces]]
binding = "XMIND_STORE"
id = "097c51aad30a41e9a661d12d67a79b48"

[vars]
MCP_AUTH_TOKEN = ""
MAX_FILE_SIZE_MB = "10"
