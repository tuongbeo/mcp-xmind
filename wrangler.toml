name = "mcp-xmind"
main = "src/index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

[[kv_namespaces]]
binding = "XMIND_META"
id = "YOUR_KV_NAMESPACE_ID"
preview_id = "YOUR_KV_PREVIEW_ID"

[[r2_buckets]]
binding = "XMIND_FILES"
bucket_name = "xmind-files"

[vars]
MCP_AUTH_TOKEN = ""
MAX_FILE_SIZE_MB = "10"
